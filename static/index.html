<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rulebook AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #243b55 0, transparent 35%),
                radial-gradient(circle at bottom right, #16222e 0, transparent 35%),
                #0b1120;
            color: #e5e7eb;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 28px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }

        /* Main Card */

        .card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        .label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        textarea::placeholder {
            color: #64748b;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.35);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result */

        #result {
            margin-top: 25px;
        }

        .result-card {
            border-top: 1px solid #334155;
            padding-top: 25px;
        }

        .classification {
            display: inline-flex;
            align-items: center;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
            background: #1e293b;
        }

        .classification.answered {
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .classification.covered {
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .classification.conflict {
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .section-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .answer {
            padding: 20px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 14px;
            line-height: 1.7;
            color: #dbeafe;
            margin-bottom: 25px;
        }

        .answer p {
            margin-top: 8px;
        }

        /* Citations */

        .citations {
            display: grid;
            gap: 10px;
        }

        .citation {
            padding: 15px;
            background: #0f172a;
            border: 1px solid #263244;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .citation-section {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .similarity {
            white-space: nowrap;
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.1);
            padding: 5px 9px;
            border-radius: 7px;
        }

        /* Loading */

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            padding: 20px 0;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #334155;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #f87171;
            background: rgba(127, 29, 29, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.25);
            padding: 15px;
            border-radius: 10px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px 0 5px;
            font-size: 14px;
        }

        /* Footer */

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #475569;
            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 25px 14px;
            }

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 20px;
            }

            .citation {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                justify-content: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">📖</div>

        <h1>Rulebook AI</h1>

        <p class="subtitle">
            Ask questions. Detect contradictions. Get evidence-backed answers.
        </p>

    </div>


    <div class="card">

        <label class="label" for="question">
            Ask the University Rulebook
        </label>

        <textarea
            id="question"
            placeholder="Example: What is the maximum number of supplementary attempts allowed?"
        ></textarea>

        <div class="actions">

            <button id="askButton" onclick="askQuestion()">
                Ask Question →
            </button>

        </div>


        <div id="result">

            <div class="empty">
                Your answer and rulebook evidence will appear here.
            </div>

        </div>

    </div>


    <div class="footer">
        Rulebook AI · Retrieval-Augmented Rulebook Analysis
    </div>

</div>


<script>

async function askQuestion() {

    const questionInput = document.getElementById("question");
    const result = document.getElementById("result");
    const button = document.getElementById("askButton");

    const question = questionInput.value.trim();

    if (!question) {

        result.innerHTML = `
            <div class="error">
                Please enter a question first.
            </div>
        `;

        return;
    }


    button.disabled = true;
    button.innerText = "Analyzing...";


    result.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <span>Searching the rulebook and analyzing evidence...</span>
        </div>
    `;


    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });


        if (!response.ok) {
            throw new Error("Server error");
        }


        const data = await response.json();


        let classificationClass = "";

        if (data.classification === "ANSWERED") {
            classificationClass = "answered";
        }

        else if (data.classification === "NOT COVERED") {
            classificationClass = "covered";
        }

        else if (data.classification === "CONFLICT") {
            classificationClass = "conflict";
        }


        let html = `

            <div class="result-card">

                <div class="classification ${classificationClass}">
                    ${data.classification}
                </div>


                <div class="section-title">
                    Answer
                </div>

                <div class="answer">
                    <p>${data.answer}</p>
                </div>


                <div class="section-title">
                    Rulebook Citations
                </div>

                <div class="citations">
        `;


        if (data.citations && data.citations.length > 0) {

            data.citations.forEach(citation => {

                html += `

                    <div class="citation">

                        <div class="citation-section">
                            ${citation.section}
                        </div>

                        <div class="similarity">
                            Similarity ${citation.similarity.toFixed(4)}
                        </div>

                    </div>

                `;

            });

        }

        else {

            html += `

                <div class="citation">

                    <div class="citation-section">
                        No supporting rulebook citation found.
                    </div>

                </div>

            `;

        }


        html += `

                </div>

            </div>

        `;


        result.innerHTML = html;

    }

    catch (error) {

        result.innerHTML = `

            <div class="error">
                Could not connect to the Rulebook AI server.
                Make sure the FastAPI server is running.
            </div>

        `;

    }

    finally {

        button.disabled = false;
        button.innerText = "Ask Question →";

    }

}

</script>

</body>
</html>
